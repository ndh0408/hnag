name: Mobile · CI

on:
  push:
    branches: [main, develop]
    paths: ['code/flutter/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['code/flutter/**']

env:
  FLUTTER_VERSION: '3.24.0'

defaults:
  run:
    working-directory: code/flutter

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: code/flutter/coverage/lcov.info

  build-android:
    needs: analyze
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: 'stable', cache: true }
      - run: flutter pub get
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
        if: env.HAS_KEY == 'true'
        env: { HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }} }
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: code/flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    needs: analyze
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: 'stable', cache: true }
      - run: flutter pub get
      - run: flutter build ipa --release --build-number=${{ github.run_number }} --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: code/flutter/build/ios/archive/Runner.xcarchive
          retention-days: 30

  distribute:
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android-app-bundle }
      - name: Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SA_JSON }}
          groups: internal-testers
          file: app-release.aab
          releaseNotes: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
