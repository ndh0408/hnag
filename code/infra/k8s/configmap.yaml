apiVersion: v1
kind: ConfigMap
metadata:
  name: hnag-backend-config
  namespace: hnag
data:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://tothanhthuy.cloud,https://dash.tothanhthuy.cloud,https://app.tothanhthuy.cloud"

  # Feature flags
  AI_FREE_DAILY_LIMIT: "10"
  AI_PREMIUM_UNLIMITED: "true"
  AI_BATCH_LLM_REASON: "true"
  AI_CACHE_TTL_SEC: "300"

  # OpenAI defaults
  OPENAI_MODEL_REASON: "gpt-4o-mini"
  OPENAI_MODEL_INTENT: "gpt-4o-mini"
  OPENAI_MODEL_DEEP: "gpt-4o"

  # Limits
  RATE_LIMIT_GLOBAL_PER_MIN: "100"
  RATE_LIMIT_AI_PER_MIN: "30"
  RATE_LIMIT_OTP_PER_HOUR: "5"

  # Geo & weather
  WEATHER_CACHE_TTL_SEC: "1800"

  # Voice
  TTS_PROVIDER_PRIMARY: "vbee"
  TTS_PROVIDER_FALLBACK: "elevenlabs"
  ASR_PROVIDER_PRIMARY: "whisper-self-hosted"
  ASR_PROVIDER_FALLBACK: "vinai"

  # S3 / CDN
  S3_REGION: "ap-southeast-1"
  S3_BUCKET: "hnag-media"
  CDN_BASE: "https://cdn.tothanhthuy.cloud"
