# =============================================================================
# HNAG production stack (self-host)
# - No host port bindings (uses Cloudflare Tunnel for public access)
# - Sits alongside other apps on the same server without conflict
# - To expose publicly: create a Cloudflare Tunnel for HNAG, paste its token
#   into hnag.env as HNAG_TUNNEL_TOKEN, then in Cloudflare Zero Trust dashboard
#   add public hostnames:
#       api.tothanhthuy.cloud   → http://hnag-backend:4000
#       dash.tothanhthuy.cloud  → http://hnag-owner-dashboard:3000
# =============================================================================
name: hnag

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: hnag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hnag
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: hnag
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnag"]
      interval: 10s
      timeout: 5s
      retries: 10
    secrets: [postgres_password]
    networks: [hnag-internal]
    deploy:
      resources:
        limits: { memory: 2G }

  redis:
    image: redis:7-alpine
    container_name: hnag-redis
    restart: unless-stopped
    # AOF + RDB combined — closes audit hnag-audit-2026-05 §5 ("Redis not persistent").
    # appendfsync=everysec is the sane default: ≤1s data loss on crash, ~5%
    # throughput overhead; RDB is the compact offline snapshot.
    #
    # Audit #39: `allkeys-lru` evicts ANY key under memory pressure, including
    # OTPs, refresh-token chains, idempotency locks — i.e. things whose
    # eviction is a correctness bug, not a performance issue. Switch to
    # `volatile-lru`: only keys with an explicit TTL are evictable. All
    # session/OTP/idempotency keys in the codebase already set EXPIRE, so
    # they remain evictable; everything without TTL stays.
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--save"
      - "60"
      - "1000"
      - "--maxmemory"
      - "768mb"
      - "--maxmemory-policy"
      - "volatile-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [hnag-internal]
    deploy:
      resources:
        limits: { memory: 1G }

  # PgBouncer — transaction-pool mode in front of Postgres.
  # Audit hnag-audit-2026-05 §4 / §39: at 5k concurrent users the default
  # max_connections=100 saturates in seconds. PgBouncer multiplexes thousands
  # of client connections onto a small fixed-size backend pool (30 conns).
  # Backend talks to hnag-pgbouncer:6432 instead of hnag-postgres:5432.
  # Transaction-mode requires Prisma to disable prepared statements — see the
  # `pgbouncer=true` flag on the DATABASE_URL below.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: hnag-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: hnag-postgres
      DB_PORT: "5432"
      DB_USER: hnag
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      DB_NAME: hnag
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "30"
      RESERVE_POOL_SIZE: "10"
      SERVER_RESET_QUERY: DISCARD ALL
      QUERY_WAIT_TIMEOUT: "120"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres: { condition: service_healthy }
    secrets: [postgres_password]
    networks: [hnag-internal]
    deploy:
      resources:
        limits: { memory: 256M }

  backend:
    image: ${HNAG_BACKEND_IMAGE:-ghcr.io/${GHCR_OWNER:-yourname}/hnag-backend:latest}
    container_name: hnag-backend
    restart: unless-stopped
    env_file:
      - ./hnag.env
    environment:
      NODE_ENV: production
      # Connects via PgBouncer (transaction-pool). `pgbouncer=true` disables
      # prepared statements on the Prisma side, required by transaction-pool
      # because connection identity is not stable across statements.
      DATABASE_URL: "postgresql://hnag:${POSTGRES_PASSWORD}@hnag-pgbouncer:6432/hnag?schema=public&pgbouncer=true&connection_limit=30"
      # Direct Postgres URL for `prisma migrate` and other operations that
      # need session-level features. Prisma reads this when running migrations.
      DIRECT_DATABASE_URL: "postgresql://hnag:${POSTGRES_PASSWORD}@hnag-postgres:5432/hnag?schema=public"
      REDIS_URL: "redis://hnag-redis:6379"
      PORT: "4000"
    depends_on:
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_started }
      redis:     { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    networks: [hnag-internal]
    # NOTE: Watchtower auto-update is intentionally disabled for this service.
    # Auto-pulling :latest into prod is a supply-chain + availability risk
    # (an upstream/registry compromise or a bad build would deploy itself
    # unattended). Deploys are gated through CI → deploy.sh with a pinned tag.
    deploy:
      resources:
        limits: { cpus: '2', memory: 1.5G }

  # Second backend replica behind nginx least_conn (audit §6).
  # Same image, same env, different container_name → DNS round-robins
  # `hnag-backend` and `hnag-backend-2` to the nginx upstream. WebSocket
  # fan-out is handled by the Redis adapter (already configured in
  # main.ts via RedisIoAdapter), so a client connected to replica 1 still
  # receives events broadcast from replica 2.
  backend-2:
    image: ${HNAG_BACKEND_IMAGE:-ghcr.io/${GHCR_OWNER:-yourname}/hnag-backend:latest}
    container_name: hnag-backend-2
    restart: unless-stopped
    env_file:
      - ./hnag.env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://hnag:${POSTGRES_PASSWORD}@hnag-pgbouncer:6432/hnag?schema=public&pgbouncer=true&connection_limit=30"
      DIRECT_DATABASE_URL: "postgresql://hnag:${POSTGRES_PASSWORD}@hnag-postgres:5432/hnag?schema=public"
      REDIS_URL: "redis://hnag-redis:6379"
      PORT: "4000"
    depends_on:
      postgres:  { condition: service_healthy }
      pgbouncer: { condition: service_started }
      redis:     { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s
    # Audit #38: keeping the `backend` DNS alias on the second replica means
    # Docker DNS round-robins traffic to BOTH replicas while nginx ALSO does
    # least_conn over them — resulting in `backend-2` getting ~75% of load.
    # Drop the alias; the nginx upstream below references each replica
    # explicitly so the LB is balanced.
    networks: [hnag-internal]
    deploy:
      resources:
        limits: { cpus: '2', memory: 1.5G }

  # Audit #40: closes the most expensive missing piece — automated Postgres
  # backups. Without this, any disk corruption / accidental drop / volume
  # loss = total data loss. Runs `pg_dump` daily inside the container, keeps
  # 7 daily / 4 weekly / 6 monthly snapshots locally. Restore via
  # `docker run … pg_restore` against the dated file.
  #
  # OPS REMINDER: schedule an offsite copy (Backblaze B2 / S3) of the
  # `pg_backups` volume — local backups don't survive disk failure.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: hnag-postgres-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: hnag-postgres
      POSTGRES_DB: hnag
      POSTGRES_USER: hnag
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SCHEDULE: "0 3 * * *"           # 03:00 UTC daily
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
      POSTGRES_EXTRA_OPTS: "-Z6 --schema=public --blobs"
    volumes:
      - pg_backups:/backups
    depends_on:
      postgres: { condition: service_healthy }
    secrets: [postgres_password]
    networks: [hnag-internal]
    deploy:
      resources:
        limits: { memory: 256M }

  owner-dashboard:
    image: ${HNAG_DASHBOARD_IMAGE:-ghcr.io/${GHCR_OWNER:-yourname}/hnag-owner-dashboard:latest}
    container_name: hnag-owner-dashboard
    restart: unless-stopped
    env_file: ./dashboard.env
    networks: [hnag-internal]
    profiles: ["full"]
    deploy:
      resources:
        limits: { memory: 384M }

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hnag-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${HNAG_TUNNEL_TOKEN}"]
    networks: [hnag-internal]
    depends_on: [backend]

volumes:
  pg_data:
  pg_backups:
  redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password

networks:
  hnag-internal:
    driver: bridge
    name: hnag-internal
