# =============================================================================
# HNAG monitoring stack — Prometheus + Grafana.
#
# Layered on top of docker-compose.prod.yml. Bring up with:
#   docker compose --env-file hnag.env \
#     -f docker-compose.prod.yml \
#     -f docker-compose.monitoring.yml \
#     up -d prometheus grafana
#
# Both services live on the same Docker network as the backend so they can
# scrape `hnag-backend:4000/metrics` without going through the public edge.
# Grafana is published on localhost:3001 only (NOT exposed to the public
# internet — tunnel via SSH or expose through Cloudflare Access when needed).
#
# Why opt-in (not in docker-compose.prod.yml):
#   - Adds ~250MB image + ~150MB runtime memory; not free
#   - Production was running stable without it; layering = safer rollout
#   - User can flip on/off without editing the main compose
# =============================================================================
services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: hnag-prometheus
    restart: unless-stopped
    user: "65534:65534"  # nobody — Prometheus does not need root
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hnag_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    # No external ports — Grafana inside the network scrapes Prometheus by
    # service DNS. Expose only if you need direct CLI access.
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:11.3.0
    container_name: hnag-grafana
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
    env_file:
      - ./hnag.env
    environment:
      # Bind admin password to an env var that lives in hnag.env (do NOT
      # hard-code). Falls back to 'changeme' so first boot is not blocked —
      # rotate immediately via /grafana/profile/password.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      # Sign-up disabled — single admin user, no public registration
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous viewer disabled — dashboards contain spend $$$ + DB state
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Plugins kept minimal; everything we need ships in core
      GF_INSTALL_PLUGINS: ""
    volumes:
      - hnag_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Bind to localhost only — never expose Grafana directly. Tunnel via
      # `ssh -L 3001:localhost:3001 ServerLinux` for access from your laptop.
      - "127.0.0.1:3001:3000"
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  hnag_prometheus_data:
  hnag_grafana_data:

networks:
  default:
    name: hnag-internal
    external: true
