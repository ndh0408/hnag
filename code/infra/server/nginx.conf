user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"ua":"$http_user_agent",'
        '"rid":"$http_x_request_id"'
      '}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 25M;        # for video/image uploads
    client_body_timeout 30s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ─── Rate limit zones ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ─── Upstream ─────────────────────────────────────────────────────
    upstream hnag_backend {
        least_conn;
        server backend:4000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream hnag_dashboard {
        server owner-dashboard:3000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # ─── Redirect HTTP → HTTPS ────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name api.tothanhthuy.cloud dash.tothanhthuy.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── API (api.tothanhthuy.cloud) ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.tothanhthuy.cloud;

        ssl_certificate     /etc/nginx/certs/live/api.tothanhthuy.cloud/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/api.tothanhthuy.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;

        limit_conn conn 100;

        # ── Health check (no rate limit) ──
        location = /health {
            access_log off;
            proxy_pass http://hnag_backend;
        }

        # ── Auth (stricter rate limit) ──
        location ~ ^/v1/auth/(otp|oauth)/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://hnag_backend;
            include /etc/nginx/proxy_common.conf;
        }

        # ── WebSocket ──
        location /socket.io/ {
            proxy_pass http://hnag_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── GraphQL (admin) ──
        location /graphql {
            proxy_pass http://hnag_backend;
            include /etc/nginx/proxy_common.conf;
        }

        # ── REST API ──
        location /v1/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://hnag_backend;
            include /etc/nginx/proxy_common.conf;
        }

        # ── ACME challenge ──
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 404;
        }
    }

    # ─── Owner Dashboard (dash.tothanhthuy.cloud) ─────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name dash.tothanhthuy.cloud;

        ssl_certificate     /etc/nginx/certs/live/dash.tothanhthuy.cloud/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/dash.tothanhthuy.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;

        location / {
            proxy_pass http://hnag_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
